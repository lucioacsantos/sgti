version: '3.8'

services:
  openldap:
    image: osixia/openldap:latest
    container_name: openldap_test
    environment:
      LDAP_ORGANISATION: "Energia"
      LDAP_DOMAIN: "energia.org.br"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
    ports:
      - "389:389"
    networks:
      - ldap-net

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin_test
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on:
      - openldap
    networks:
      - ldap-net

networks:
  ldap-net:
    driver: bridge
